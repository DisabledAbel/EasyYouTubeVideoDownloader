[package]
name = "easy-youtube-video-downloader"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.7", features = ["http"] }
gloo-timers = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Location", "Url", "Document", "Element", "Storage", "HtmlInputElement", "FileList", "File", "Blob"] }
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
