name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/trunk
            frontend/target
          key: ${{ runner.os }}-cargo-trunk-0.21.14-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('frontend/Cargo.lock') }}
      - run: bash scripts/install-frontend.sh
      - run: cargo fmt --manifest-path frontend/Cargo.toml -- --check
      - run: bash scripts/build-frontend.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website
          path: frontend/dist
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t easy-youtube-video-downloader:ci .
      - name: Verify container startup and download dependencies
        run: |
          docker run -d --name archiver -p 8000:8000 -e ARCHIVE_API_KEY=ci-only-test-key-not-for-production easy-youtube-video-downloader:ci
          curl --fail --retry 12 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:8000/health
          docker exec archiver node --version
          docker exec archiver ffmpeg -version
          docker exec archiver python -c "import yt_dlp_ejs"
      - name: Container logs
        if: failure()
        run: docker logs archiver || true
